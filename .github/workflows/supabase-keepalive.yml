# Keeps the free Supabase project from pausing after 7 idle days: calls the public kart_ping()
# database function twice a day with the publishable (public) key. Copy to .github/workflows/ in
# the publish repo only once cloud/schema.sql has been run in Supabase.
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3,15 * * *'   # 06:17 and 18:17 Israel time (summer)
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ping database
        env:
          URL: https://oboktedmsmqixeqbfoym.supabase.co
          KEY: sb_publishable_5A-akLv-Us_CAhgBJQxL_w_xaKFKGzH
        run: |
          code=$(curl -s -o out.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/kart_ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat out.txt)"
          test "$code" = 200
